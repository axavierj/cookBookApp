<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="../js/db/dexie.js" defer></script>
    <script type="module" src="../js/components/ui/header.ui.js" defer></script>
    <script
      type="module"
      src="../js/components/icons/home.icon.js"
      defer
    ></script>
    <script
      type="module"
      src="../js/components/icons/create.icon.js"
      defer
    ></script>
    <script type="module" src="../js/edit.js" defer></script>
    <script
      type="module"
      src="../js/components/icons/delete.icon.js"
      defer
    ></script>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>cookbook</title>
  </head>
  <body>
    <dialog id="alertDialog">
      <div class="flex justify-between align-center">
        <h5>Alert</h5>
        <button class="btn [ close-button ]" id="closeDialog">Close</button>
      </div>
      <p id="alertMessage"></p>
    </dialog>
    <app-header></app-header>
    <main id="Home">
      <div class="[ form-container ]" id="createRecipeForm">
        <section class="[ form-grp ]" id="recipeNameSection">
          <label for="name">Recipe Name:</label>
          <input type="text" id="name" name="name" required />
        </section>
        <section class="[ form-grp ]" id="ingredientsSection">
          <div class="[ form-grp ]" id="ingrediantName">
            <label for="ingredient">Ingredient:</label>
            <input type="text" id="ingredient" name="ingredient" required />
          </div>
          <div class="[ form-grp ]" id="ingretiantUnit">
            <label for="unit">Unit:</label>
            <select id="unit" name="unit" required>
              <option value="grams">grams</option>
              <option value="teaspoons">teaspoons</option>
              <option value="tablespoons">tablespoons</option>
              <option value="ml">ml</option>
              <option value="liters">liters</option>
              <option value="cups">cups</option>
              <option value="pieces">pieces</option>
              <option value="pinches">pinches</option>
              <option value="each">each</option>
            </select>
          </div>
          <div class="[ form-grp ]" id="ingredientQuantity">
            <label for="quantity">Quantity:</label>
            <input
              type="number"
              id="quantity"
              name="quantity"
              min="0"
              value="0"
              required
            />
          </div>
          <button class="btn" type="button" id="addIngredient">
            Add Ingredient
          </button>
        </section>
        <section class="[ form-grp ]" id="recipeInstuction">
          <label for="instructions">Instructions:</label>
          <textarea id="instructions" name="instructions" required></textarea>
        </section>
        <button class="btn" type="button" id="addInstruction">
          Add instructions
        </button>
      </div>
      <div
        class="flex flex-column align-center justify-center"
        id="recipeContainer"
      >
        <div id="recipeName">
          <h2>name</h2>
        </div>
        <div class="[ divider ]"></div>
        <div id="recipeIngredients">
          <h3 class="mb-lg">Ingredients</h3>
          <ul class="list-grp" id="recipeIngredientsList"></ul>
        </div>
        <div class="[ divider ]"></div>
        <div id="recipeInstructions">
          <h3 class="mb-lg">Instructions</h3>
          <ul class="list-grp" id="recipeInstructionsList"></ul>
        </div>
        <button class="btn mt-lg" type="button" id="updateRecipe">
          update Recipe
        </button>
      </div>
    </main>
    <footer>
      <p>&copy; 2024 Cookbook. All rights reserved.</p>
    </footer>
  </body>
</html>
