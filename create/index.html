<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="../js/db/dexie.js" defer></script>
    <script type="module" src="../js/db/db.js" defer></script>
    <script type="module" src="../js/db/api.js" defer></script>
    <script type="module" src="../js/create.js" defer></script>
    <script type="module" src="../js/components/ui/header.ui.js" defer></script>
    <script
      type="module"
      src="../js/components/icons/delete.icon.js"
      defer
    ></script>
    <script
      type="module"
      src="../js/components/icons/home.icon.js"
      defer
    ></script>
    <script type="module" src="../js/components/ui/footer.ui.js" defer></script>
    <script
      type="module"
      src="../js/components/icons/create.icon.js"
      defer
    ></script>
    <script type="module" src="../js/components/ui/button.ui.js" defer></script>

    <script type="module" src="../js/components/ui/alert.ui.js" defer></script>
    <script
      type="module"
      src="../js/components/ui/createForm.ui.js"
      defer
    ></script>
    <!-- styles -->
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/animations.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>cookbook</title>
  </head>
  <body>
    <app-alert></app-alert>
    <app-header></app-header>
    <main class="p-sm" id="Home">
      <div class="mb-lg flex justify-center">
        <h2 class="">Create Recipe</h2>
      </div>
      <create-form></create-form>
      <div id="createRecipeDisplay">
        <section class="mb-lg flex justify-center">
          <h2>Recipe Preview</h2>
        </section>
        <div class="[ divider ]"></div>
        <section
          class="mb-lg flex flex-column align-center justify-center"
          id="recipePreviewContent"
        >
          <div id="previewName"></div>
          <div class="[ divider ]"></div>
          <div>
            <p>ingredient :</p>
          </div>
          <div id="previewIngredients">
            <ul class="list-grp" id="previewIngredientsList"></ul>
          </div>
          <div class="[ divider ]"></div>
          <div id="previewInstructions">
            <div><p>instructions :</p></div>
            <ul class="list-grp" id="previewInstructionsList"></ul>
          </div>
          <div class="[ divider ]"></div>
          <button class="btn" type="submit" id="createRecipeButton">
            Create Recipe
          </button>
        </section>
      </div>
    </main>
    <app-footer></app-footer>
  </body>
</html>
