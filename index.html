<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- js -->
    <script type="module" src="js/db/dexie.js" defer></script>
    <script type="module" src="js/db/db.js" defer></script>
    <script type="module" src="js/db/api.js" defer></script>
    <script type="module" src="js/main.js" defer></script>
    <script
      type="module"
      src="js/components/icons/delete.icon.js"
      defer
    ></script>
    <script type="module" src="js/components/icons/edit.icon.js" defer></script>
    <script type="module" src="js/components/icons/view.icon.js" defer></script>
    <script type="module" src="js/components/icons/home.icon.js" defer></script>
    <script
      type="module"
      src="js/components/icons/create.icon.js"
      defer
    ></script>
    <script type="module" src="js/components/ui/header.ui.js" defer></script>
    <script type="module" src="js/components/ui/list.ui.js" defer></script>
    <!-- styles -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>cookbook</title>
  </head>
  <body>
    <app-header></app-header>
    <main class="[ main-content ]" id="Home">
      <div class="flex flex-column align-center justify-center">
        <section class="form-grp [ search ]" id="search">
          <input type="text" id="searchInput" placeholder="Search recipes..." />
        </section>
        <recipe-list></recipe-list>
        <ul
          class="flex flex-column align-center justify-center [ recipe-list ]"
          id="recipeListContainer"
        >
          <li class="[ recipe-item ]">
            <div>
              <p>Recipe 1</p>
              <section>
                <button id="delete">Delete</button>
                <a href="/view/">view</a>
                <a href="/edit/">Edit</a>
              </section>
            </div>
          </li>
        </ul>
        <section class="mt-md flex gap-md [ pagination ]" id="pagination">
          <button id="prevPage">Prev</button>
          <div class="flex gap-md" id="pageContainer"></div>
          <button id="nextPage">Next</button>
        </section>
      </div>
    </main>
    <footer>
      <p>&copy; 2024 Cookbook. All rights reserved.</p>
    </footer>
  </body>
</html>
